<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="design-4-overview-title design-4-overview-desc" id="design-4-overview-root">
        <title id="design-4-overview-title">Design 4 overview: per-sandbox collectors behind a registry</title>
        <desc id="design-4-overview-desc">Stats and metrics requests find their sandbox collector through an O(1) registry and then collect and cache under that sandbox&#x27;s own lock, while sandbox removal only detaches the collector under the registry lock.</desc>
        <defs>
      <style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;family=Noto+Serif:ital@0;1&amp;family=Noto+Sans+KR:wght@400;500;600&amp;family=Noto+Serif+KR:wght@400&amp;family=Noto+Sans+TC:wght@400;500;600&amp;family=Noto+Serif+TC:wght@400&amp;display=swap');
      #design-4-overview-root { --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-accent:  #bf4520;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace; }
      #design-4-overview-root { font-family: var(--font-sans); color: var(--color-ink); }
      #design-4-overview-root .diagram-container { width: 100%; overflow-x: auto; }
      @media print {
#design-4-overview-root .diagram-container { overflow-x: visible; }
}</style>
          <marker id="design-4-overview-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
          <marker id="design-4-overview-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#bf4520"/></marker>
          <marker id="design-4-overview-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>

        </defs>
        <rect width="100%" height="100%" fill="#f5f5f5"/>
<line x1="280" y1="144" x2="280" y2="200" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#design-4-overview-arrow)"/>
<line x1="280" y1="272" x2="280" y2="328" stroke="#bf4520" stroke-width="1.4" marker-end="url(#design-4-overview-arrow-accent)"/>
<line x1="680" y1="144" x2="680" y2="200" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#design-4-overview-arrow)"/>
<!-- Node: Stats or metrics request -->
<rect x="120" y="72" width="320" height="72" rx="6" fill="#f5f5f5"/>
<rect x="120" y="72" width="320" height="72" rx="6" fill="#4f5d75" stroke="#5a6580" stroke-width="1" fill-opacity="0.10"/>
<text x="280" y="99" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Stats or metrics request</text>
<text x="280" y="112.5" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">ListContainerStats · PodSandboxStats</text>
<text x="280" y="125.5" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">ListPodSandboxMetrics</text>
<!-- Node: Find the sandbox collector -->
<rect x="120" y="200" width="320" height="72" rx="6" fill="#f5f5f5"/>
<rect x="120" y="200" width="320" height="72" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
<text x="280" y="227" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Find the sandbox collector</text>
<text x="280" y="240.5" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">collectorRegistry.forSandbox(sb)</text>
<text x="280" y="253.5" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">registry.mu · O(1), then released</text>
<!-- Node: Collect and cache under the -->
<rect x="120" y="328" width="320" height="72" rx="6" fill="#f5f5f5"/>
<rect x="120" y="328" width="320" height="72" rx="6" fill="#bf4520" stroke="#bf4520" stroke-width="1" fill-opacity="0.08"/>
<text x="280" y="353.5" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Collect and cache under the</text>
<text x="280" y="369.5" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">per-sandbox lock</text>
<text x="280" y="383" fill="#bf4520" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">sandboxCollector.mu</text>
<!-- Node: Remove sandbox -->
<rect x="520" y="72" width="320" height="72" rx="6" fill="#f5f5f5"/>
<rect x="520" y="72" width="320" height="72" rx="6" fill="#4f5d75" stroke="#5a6580" stroke-width="1" fill-opacity="0.10"/>
<text x="680" y="105.5" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Remove sandbox</text>
<text x="680" y="119" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">RemoveSandbox</text>
<!-- Node: Detach collector under the -->
<rect x="520" y="200" width="320" height="72" rx="6" fill="#f5f5f5"/>
<rect x="520" y="200" width="320" height="72" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
<text x="680" y="225.5" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Detach collector under the</text>
<text x="680" y="241.5" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">registry lock</text>
<text x="680" y="255" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">collectorRegistry.remove(id)</text>
<text x="520" y="348" fill="#2d3142" font-size="14" font-style="italic" font-family="'Instrument Serif', serif">a disk walk still holds this lock,</text>
<text x="520" y="368" fill="#2d3142" font-size="14" font-style="italic" font-family="'Instrument Serif', serif">so stats for that pod can wait behind metrics</text>
<path d="M 516 352 Q 484 356 448 364" fill="none" stroke="#2d3142" stroke-width="1" stroke-dasharray="4,3" stroke-opacity="0.40"/>
<circle cx="444" cy="364" r="2" fill="#2d3142"/>
<line x1="120" y1="480" x2="840" y2="480" stroke="#2d3142" stroke-width="0.8" stroke-opacity="0.10"/>
<text x="120" y="496" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em">LEGEND</text>
<rect x="120" y="512" width="14" height="10" rx="2" fill="#4f5d75" stroke="#5a6580" stroke-width="1" fill-opacity="0.10"/>
<text x="140" y="520" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Request / lifecycle event</text>
<rect x="296" y="512" width="14" height="10" rx="2" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
<text x="316" y="520" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Registry step</text>
<rect x="424" y="512" width="14" height="10" rx="2" fill="#bf4520" stroke="#bf4520" stroke-width="1" fill-opacity="0.08"/>
<text x="444" y="520" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Per-sandbox collection (focal)</text>
<line x1="616" y1="517" x2="644" y2="517" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#design-4-overview-arrow)"/>
<text x="652" y="520" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Call</text>
<line x1="720" y1="517" x2="748" y2="517" stroke="#bf4520" stroke-width="1.4" marker-end="url(#design-4-overview-arrow-accent)"/>
<text x="756" y="520" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Lock-holding path</text>
      </svg>
