<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1280 720" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="design-3-types-title design-3-types-desc" id="design-3-types-root">
        <title id="design-3-types-title">Design 3 data structures</title>
        <desc id="design-3-types-desc">UML class diagram of StatsServer with separate stats and metrics mutexes and maps, depending on the generic cachedOrCollect helper, a statsProjection that reads the writable layer through GraphDriver, a metricsProjection that makes the gated DiskStats call, and the RuntimeSeam interface.</desc>
        <defs>
      <style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;family=Noto+Serif:ital@0;1&amp;family=Noto+Sans+KR:wght@400;500;600&amp;family=Noto+Serif+KR:wght@400&amp;family=Noto+Sans+TC:wght@400;500;600&amp;family=Noto+Serif+TC:wght@400&amp;display=swap');
      #design-3-types-root { --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-accent:  #bf4520;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', 'Noto Serif', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace; }
      #design-3-types-root { font-family: var(--font-sans); color: var(--color-ink); }
      #design-3-types-root .diagram-container { width: 100%; overflow-x: auto; }
      @media print {
#design-3-types-root .diagram-container { overflow-x: visible; }
}</style>
