<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1280 720" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="design-1-sequence-title design-1-sequence-desc" id="design-1-sequence-root">
        <title id="design-1-sequence-title">Design 1 request sequence</title>
        <desc id="design-1-sequence-desc">Sequence in which a stats caller calls getOrCollect on store[statsView]; a cached value returns under a short lock, otherwise the collector gathers cgroup stats and writable-layer usage without the store lock and without calling DiskStats, and the store projects, merges CPU, and returns ContainerStats.</desc>
        <defs>
      <style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;family=Noto+Serif:ital@0;1&amp;family=Noto+Sans+KR:wght@400;500;600&amp;family=Noto+Serif+KR:wght@400&amp;family=Noto+Sans+TC:wght@400;500;600&amp;family=Noto+Serif+TC:wght@400&amp;display=swap');
      #design-1-sequence-root { --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-accent:  #bf4520;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace; }
      #design-1-sequence-root { font-family: var(--font-sans); color: var(--color-ink); }
      #design-1-sequence-root .diagram-container { width: 100%; overflow-x: auto; }
      @media print {
#design-1-sequence-root .diagram-container { overflow-x: visible; }
}</style>
