<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Design 4 data structures</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-accent:  #bf4520;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }
    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }
    .frame { max-width: 1320px; width: 100%; }
    .diagram-container { width: 100%; overflow-x: auto; }
    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }
    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }
    svg { width: 100%; min-width: 1280px; display: block; }
    @media print {
      .diagram-container { overflow-x: visible; }
      svg { min-width: 0; }
    }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Design 4 · Per-sandbox collector registry</p>
    <h1>Data structures</h1>
    <div class="diagram-container">
      <svg viewBox="0 0 1280 720" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="design-4-types-title design-4-types-desc">
        <title id="design-4-types-title">Design 4 data structures</title>
        <desc id="design-4-types-desc">Class diagram of StatsServer composing a collectorRegistry that composes one sandboxCollector per pod, with the collector depending on containerSample, statsProjection and metricsProjection.</desc>

          <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
          <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#bf4520"/></marker>
          <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
          <marker id="uml-triangle" markerWidth="16" markerHeight="12" refX="15" refY="6" orient="auto" markerUnits="userSpaceOnUse"><polygon points="0 0, 16 6, 0 12" fill="#f5f5f5" stroke="#2d3142" stroke-width="1"/></marker>
          <marker id="uml-diamond-filled" markerWidth="18" markerHeight="10" refX="0" refY="5" orient="auto" markerUnits="userSpaceOnUse"><polygon points="0 5, 9 0, 18 5, 9 10" fill="#2d3142"/></marker>
          <marker id="uml-diamond-hollow" markerWidth="18" markerHeight="10" refX="0" refY="5" orient="auto" markerUnits="userSpaceOnUse"><polygon points="0 5, 9 0, 18 5, 9 10" fill="#f5f5f5" stroke="#2d3142" stroke-width="1"/></marker>
          <marker id="uml-open" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L9,4 L0,8" fill="none" stroke="#4f5d75" stroke-width="1"/></marker>
        </defs>
        <rect width="100%" height="100%" fill="#f5f5f5"/>
<line x1="210" y1="260" x2="210" y2="332" stroke="#2d3142" stroke-width="1" marker-start="url(#uml-diamond-filled)"/>
<line x1="340" y1="384" x2="476" y2="384" stroke="#2d3142" stroke-width="1" marker-start="url(#uml-diamond-filled)"/>
<line x1="780" y1="192" x2="920" y2="192" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#uml-open)"/>

<text x="412" y="375" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.04em">ONE PER POD</text>
<rect x="812" y="174" width="76" height="12" rx="2" fill="#f5f5f5"/>
<text x="850" y="183" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.04em">GATHERS ONCE</text>
<!-- Class: StatsServer -->
<rect x="80" y="80" width="260" height="180" rx="6" fill="#f5f5f5"/>

<text x="96" y="148" fill="#2d3142" font-size="9" font-family="'Geist Mono', monospace">- registry: collectorRegistry</text>
<text x="96" y="166" fill="#2d3142" font-size="9" font-family="'Geist Mono', monospace">- collectionPeriod: Duration</text>

<text x="96" y="472" fill="#2d3142" font-size="9" font-family="'Geist Mono', monospace">+ remove(id)</text>

<text x="492" y="270" fill="#2d3142" font-size="9" font-family="'Geist Mono', monospace">- ctrStats: Map&lt;string,ContainerStats&gt;</text>
<text x="492" y="288" fill="#2d3142" font-size="9" font-family="'Geist Mono', monospace">- metricsAt: Time</text>
<text x="492" y="306" fill="#2d3142" font-size="9" font-family="'Geist Mono', monospace">- metrics: SandboxMetrics</text>
<line x1="476" y1="316" x2="780" y2="316" stroke="rgba(191,69,32,0.40)" stroke-width="1"/>

<text x="492" y="354" fill="#2d3142" font-size="9" font-family="'Geist Mono', monospace">+ containerStats(ctx, period, id): ContainerStats</text>
<text x="492" y="372" fill="#2d3142" font-size="9" font-family="'Geist Mono', monospace">+ sandboxMetrics(ctx, period): SandboxMetrics</text>
<text x="492" y="390" fill="#2d3142" font-size="9" font-family="'Geist Mono', monospace">+ removeContainer(id)</text>
<text x="492" y="408" fill="#2d3142" font-size="9" font-family="'Geist Mono', monospace">+ refreshSandboxStats(ctx)</text>
<text x="492" y="426" fill="#2d3142" font-size="9" font-family="'Geist Mono', monospace">+ refreshMetrics(ctx)</text>
<!-- Class: containerSample -->
<rect x="920" y="144" width="280" height="84" rx="6" fill="#f5f5f5"/>
<rect x="920" y="144" width="280" height="84" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
<text x="1060" y="167" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist Mono', monospace" text-anchor="middle">containerSample</text>
<line x1="920" y1="180" x2="1200" y2="180" stroke="rgba(45,49,66,0.22)" stroke-width="1"/>

<text x="936" y="218" fill="#2d3142" font-size="9" font-family="'Geist Mono', monospace">+ cgroup: CgroupStats</text>

<rect x="920" y="272" width="280" height="78" rx="6" fill="#f5f5f5"/>

<rect x="920" y="394" width="280" height="78" rx="6" fill="#f5f5f5"/>
<rect x="920" y="394" width="280" height="78" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>

<text x="920" y="643" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Dependency · uses</text>
<rect x="1056" y="635" width="14" height="10" rx="2" fill="rgba(191,69,32,0.08)" stroke="#bf4520" stroke-width="1"/>
<text x="1076" y="643" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Focal: lock held across collection</text>
      </svg>
    </div>
  </div>
</body>
