<path d="M 740,280 V 344 Q 740,352 732,352 H 620" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#design-2-overview-arrow)"/>
<path d="M 440,376 V 404 Q 440,412 432,412 H 308 Q 300,412 300,420 V 448" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#design-2-overview-arrow)"/>
<path d="M 520,376 V 404 Q 520,412 528,412 H 652 Q 660,412 660,420 V 448" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#design-2-overview-arrow)"/>
<rect x="608" y="132" width="96" height="12" rx="2" fill="#f5f5f5"/>
<text x="656" y="141" fill="#5a6580" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.02em">MISS OR ON DEMAND</text>
<rect x="450" y="248" width="24" height="12" rx="2" fill="#f5f5f5"/>
<text x="462" y="257" fill="#5a6580" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.02em">HIT</text>
<text x="920" y="60" fill="#bf4520" font-size="14" font-style="italic" font-family="'Instrument Serif', 'Noto Serif', serif" text-anchor="end">The same process-wide settings drive both paths:</text>
<text x="920" y="78" fill="#bf4520" font-size="14" font-style="italic" font-family="'Instrument Serif', 'Noto Serif', serif" text-anchor="end">enabling disk metrics makes stats requests</text>
<text x="920" y="96" fill="#bf4520" font-size="14" font-style="italic" font-family="'Instrument Serif', 'Noto Serif', serif" text-anchor="end">walk the rootfs on a fresh collection.</text>
<path d="M 864,104 V 226" fill="none" stroke="#bf4520" stroke-width="1" stroke-dasharray="4,3" stroke-opacity="0.50"/>
<circle cx="864" cy="228" r="2" fill="#bf4520"/>
