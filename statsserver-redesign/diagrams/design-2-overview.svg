<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="design-2-overview-title design-2-overview-desc" id="design-2-overview-root">
        <title id="design-2-overview-title">Design 2 overview: collect, store, project</title>
        <desc id="design-2-overview-desc">Flowchart of Design 2: a stats or metrics request looks for a cached sample, collects a new one with process-wide settings on a miss, stores current and previous samples, and builds either stats or metrics from them.</desc>
        <defs>
      <style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;family=Noto+Serif:ital@0;1&amp;family=Noto+Sans+KR:wght@400;500;600&amp;family=Noto+Serif+KR:wght@400&amp;family=Noto+Sans+TC:wght@400;500;600&amp;family=Noto+Serif+TC:wght@400&amp;display=swap');
      #design-2-overview-root { --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-accent:  #bf4520;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', 'Noto Serif', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace; }
      #design-2-overview-root { font-family: var(--font-sans); color: var(--color-ink); }
      #design-2-overview-root .diagram-container { width: 100%; overflow-x: auto; }
      @media print {
#design-2-overview-root .diagram-container { overflow-x: visible; }
}</style>
<marker id="design-2-overview-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
<marker id="design-2-overview-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#bf4520"/></marker>
<marker id="design-2-overview-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>

        </defs>
        <rect width="100%" height="100%" fill="#f5f5f5"/>
<g transform="translate(-80,0)">
<path d="M 480,88 V 136" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#design-2-overview-arrow)"/>
<path d="M 580,160 H 732 Q 740,160 740,168 V 232" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#design-2-overview-arrow)"/>
