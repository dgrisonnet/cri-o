<text x="480" y="68.3" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">Stats or metrics request</text>
<rect x="380" y="136" width="200" height="48" rx="6" fill="#f5f5f5"/>
<rect x="380" y="136" width="200" height="48" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
<text x="480" y="164.3" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">Look for a cached sample</text>
<rect x="600" y="232" width="280" height="48" rx="6" fill="#f5f5f5"/>
<rect x="600" y="232" width="280" height="48" rx="6" fill="#bf4520" stroke="#bf4520" stroke-width="1" fill-opacity="0.08"/>
<text x="740" y="260.3" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">Collect using process-wide settings</text>
<rect x="340" y="328" width="280" height="48" rx="6" fill="#f5f5f5"/>
<rect x="340" y="328" width="280" height="48" rx="6" fill="#2d3142" stroke="#4f5d75" stroke-width="1" fill-opacity="0.05"/>
<text x="480" y="356.3" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">Store current and previous samples</text>
<rect x="200" y="448" width="200" height="48" rx="6" fill="#f5f5f5"/>
<rect x="200" y="448" width="200" height="48" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
<text x="300" y="476.3" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">Build stats</text>
<rect x="560" y="448" width="200" height="48" rx="6" fill="#f5f5f5"/>
<rect x="560" y="448" width="200" height="48" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
<text x="660" y="476.3" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">Build metrics</text>
</g>
<line x1="40" y1="536" x2="920" y2="536" stroke="#2d3142" stroke-width="0.8" stroke-opacity="0.10"/>
<text x="40" y="552" fill="#4f5d75" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" letter-spacing="0.18em">LEGEND</text>
<rect x="40" y="564" width="14" height="10" rx="2" fill="#4f5d75" stroke="#5a6580" stroke-width="1" fill-opacity="0.10"/>
<text x="60" y="572" fill="#4f5d75" font-size="8.5" font-family="'Geist', system-ui, sans-serif">Request</text>
<rect x="124" y="564" width="14" height="10" rx="2" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
<text x="144" y="572" fill="#4f5d75" font-size="8.5" font-family="'Geist', system-ui, sans-serif">Step</text>
<rect x="196" y="564" width="14" height="10" rx="2" fill="#2d3142" stroke="#4f5d75" stroke-width="1" fill-opacity="0.05"/>
<text x="216" y="572" fill="#4f5d75" font-size="8.5" font-family="'Geist', system-ui, sans-serif">Sample store</text>
<rect x="308" y="564" width="14" height="10" rx="2" fill="#bf4520" stroke="#bf4520" stroke-width="1" fill-opacity="0.08"/>
<text x="328" y="572" fill="#4f5d75" font-size="8.5" font-family="'Geist', system-ui, sans-serif">Process-wide collection settings</text>
<line x1="520" y1="569" x2="548" y2="569" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#design-2-overview-arrow)"/>
<text x="556" y="572" fill="#4f5d75" font-size="8.5" font-family="'Geist', system-ui, sans-serif">Flow</text>

      </svg>
