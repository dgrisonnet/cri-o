<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1280 720" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="review-proposed-cache-fill-title review-proposed-cache-fill-desc" id="review-proposed-cache-fill-root">
        <title id="review-proposed-cache-fill-title">How the proposed cache is filled in periodic mode</title>
        <desc id="review-proposed-cache-fill-desc">With a positive collection period, independent stats and metrics sweeps plus synchronous cache misses fill pod stats entries, a per-container stats history shared by nested and standalone stats, and pod metrics entries, each write passing the lifecycle token and newer-observation check.</desc>
