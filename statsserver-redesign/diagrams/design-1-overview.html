<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Overview</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-accent:  #bf4520;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }
    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }
    .frame { max-width: 1000px; width: 100%; }
    .diagram-container { width: 100%; overflow-x: auto; }
    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }
    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }
    svg { width: 100%; min-width: 960px; display: block; }
    @media print {
      .diagram-container { overflow-x: visible; }
      svg { min-width: 0; }
    }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Design 1 · Layered Sample-and-Project</p>
    <h1>Overview</h1>
    <div class="diagram-container">
      <svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="design-1-overview-title design-1-overview-desc">
        <title id="design-1-overview-title">Design 1 overview: layered sample-and-project</title>
        <desc id="design-1-overview-desc">Flow in which a request or periodic refresh chooses inputs for the requested views, collects one sample outside cache locks, and builds stats and metrics into separate caches.</desc>
        <defs>
          <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
          <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#bf4520"/></marker>
          <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>

        </defs>
        <rect width="100%" height="100%" fill="#f5f5f5"/>
        <!-- connectors -->
        <line x1="480" y1="96" x2="480" y2="136" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <line x1="480" y1="184" x2="480" y2="224" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <path d="M 424,272 V 296 Q 424,304 416,304 H 328 Q 320,304 320,312 V 336" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <path d="M 536,272 V 296 Q 536,304 544,304 H 632 Q 640,304 640,312 V 336" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <line x1="320" y1="384" x2="320" y2="440" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <line x1="640" y1="384" x2="640" y2="440" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <!-- nodes -->
        <rect x="360" y="48" width="240" height="48" rx="6" fill="#f5f5f5"/>
        <rect x="360" y="48" width="240" height="48" rx="6" fill="rgba(79,93,117,0.10)" stroke="#5a6580" stroke-width="1"/>
        <text x="480" y="75.5" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">Request or periodic refresh</text>
        <rect x="320" y="136" width="320" height="48" rx="6" fill="#f5f5f5"/>
        <rect x="320" y="136" width="320" height="48" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="480" y="163.5" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">Choose inputs for the requested views</text>
        <rect x="320" y="224" width="320" height="48" rx="6" fill="#f5f5f5"/>
        <rect x="320" y="224" width="320" height="48" rx="6" fill="rgba(191,69,32,0.08)" stroke="#bf4520" stroke-width="1"/>
        <text x="480" y="251.5" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">Collect a sample outside cache locks</text>
        <rect x="220" y="336" width="200" height="48" rx="6" fill="#f5f5f5"/>
        <rect x="220" y="336" width="200" height="48" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="320" y="363.5" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">Build stats</text>
        <rect x="540" y="336" width="200" height="48" rx="6" fill="#f5f5f5"/>
        <rect x="540" y="336" width="200" height="48" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="640" y="363.5" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">Build metrics</text>
        <rect x="220" y="440" width="200" height="48" rx="6" fill="#f5f5f5"/>
        <rect x="220" y="440" width="200" height="48" rx="6" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
        <text x="320" y="467.5" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">Stats cache</text>
        <rect x="540" y="440" width="200" height="48" rx="6" fill="#f5f5f5"/>
        <rect x="540" y="440" width="200" height="48" rx="6" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
        <text x="640" y="467.5" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">Metrics cache</text>
        <line x1="40" y1="532" x2="920" y2="532" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
        <text x="40" y="548" fill="#4f5d75" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" letter-spacing="0.18em">LEGEND</text>
        <rect x="40" y="564" width="14" height="10" rx="2" fill="rgba(79,93,117,0.10)" stroke="#5a6580" stroke-width="1"/>
        <text x="60" y="572" fill="#4f5d75" font-size="8.5" font-family="'Geist', system-ui, sans-serif">Trigger</text>
        <rect x="132" y="564" width="14" height="10" rx="2" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="152" y="572" fill="#4f5d75" font-size="8.5" font-family="'Geist', system-ui, sans-serif">Step</text>
        <rect x="212" y="564" width="14" height="10" rx="2" fill="rgba(191,69,32,0.08)" stroke="#bf4520" stroke-width="1"/>
        <text x="232" y="572" fill="#4f5d75" font-size="8.5" font-family="'Geist', system-ui, sans-serif">Focal step</text>
        <rect x="316" y="564" width="14" height="10" rx="2" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
        <text x="336" y="572" fill="#4f5d75" font-size="8.5" font-family="'Geist', system-ui, sans-serif">Cache</text>
        <line x1="396" y1="569" x2="424" y2="569" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <text x="432" y="572" fill="#4f5d75" font-size="8.5" font-family="'Geist', system-ui, sans-serif">Flow</text>
      </svg>
    </div>
  </div>
</body>
</html>
