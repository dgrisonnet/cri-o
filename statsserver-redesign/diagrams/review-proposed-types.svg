<svg viewBox="0 0 1280 800" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="review-proposed-types-title review-proposed-types-desc" id="review-proposed-types-root">
        <title id="review-proposed-types-title">Proposed design data structures</title>
        <desc id="review-proposed-types-desc">StatsServer owns two admission budgets and a short-lock result store holding pod stats entries, a per-container history shared by nested and standalone stats, and pod metrics entries; each holds immutable observations carrying a lifecycle token, monotonic observation time, counter source and present fields built from normalized runtime adapter samples.</desc>
