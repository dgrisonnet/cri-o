<line x1="896" y1="96" x2="896" y2="648" stroke="#2d3142" stroke-width="1" stroke-dasharray="3,3" stroke-opacity="0.22"/>
<line x1="1152" y1="96" x2="1152" y2="648" stroke="#2d3142" stroke-width="1" stroke-dasharray="3,3" stroke-opacity="0.22"/>
<!-- Activation bars -->
<rect x="380" y="148" width="8" height="484" fill="#2d3142" stroke="#4f5d75" stroke-width="0.8" fill-opacity="0.06"/>
<rect x="636" y="204" width="8" height="372" fill="#2d3142" stroke="#4f5d75" stroke-width="0.8" fill-opacity="0.06"/>
<rect x="892" y="280" width="8" height="264" fill="#2d3142" stroke="#4f5d75" stroke-width="0.8" fill-opacity="0.06"/>
<rect x="1148" y="480" width="8" height="64" fill="#2d3142" stroke="#4f5d75" stroke-width="0.8" fill-opacity="0.06"/>
