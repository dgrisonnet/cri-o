<line x1="40" y1="695" x2="68" y2="695" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#design-3-sequence-arrow-link)"/>
<text x="76" y="698" fill="#4f5d75" font-size="8.5" font-family="'Geist', system-ui, sans-serif">CRI call</text>
<line x1="148" y1="695" x2="176" y2="695" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#design-3-sequence-arrow)"/>
<text x="184" y="698" fill="#4f5d75" font-size="8.5" font-family="'Geist', system-ui, sans-serif">Call / self-step</text>
