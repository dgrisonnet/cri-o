<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1280 720" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="design-3-sequence-title design-3-sequence-desc" id="design-3-sequence-root">
        <title id="design-3-sequence-title">Design 3 request sequence: eviction and late publication</title>
        <desc id="design-3-sequence-desc">Sequence in which a slow metrics poll starts a DiskStats walk with no cache lock held, sandbox removal evicts the cached metrics and releases stateLock without waiting, and the walk then finishes and its unconditional put can recreate the removed entry.</desc>
        <defs>
      <style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;family=Noto+Serif:ital@0;1&amp;family=Noto+Sans+KR:wght@400;500;600&amp;family=Noto+Serif+KR:wght@400&amp;family=Noto+Sans+TC:wght@400;500;600&amp;family=Noto+Serif+TC:wght@400&amp;display=swap');
      #design-3-sequence-root { --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-accent:  #bf4520;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', 'Noto Serif', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace; }
      #design-3-sequence-root { font-family: var(--font-sans); color: var(--color-ink); }
      #design-3-sequence-root .diagram-container { width: 100%; overflow-x: auto; }
      @media print {
#design-3-sequence-root .diagram-container { overflow-x: visible; }
}</style>
          <marker id="design-3-sequence-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
          <marker id="design-3-sequence-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#bf4520"/></marker>
          <marker id="design-3-sequence-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
          
        </defs>
        <rect width="100%" height="100%" fill="#f5f5f5"/>
<!-- Lifelines -->
<line x1="128" y1="96" x2="128" y2="648" stroke="#2d3142" stroke-width="1" stroke-dasharray="3,3" stroke-opacity="0.22"/>
<line x1="384" y1="96" x2="384" y2="648" stroke="#2d3142" stroke-width="1" stroke-dasharray="3,3" stroke-opacity="0.22"/>
