<path d="M 388,600 H 420 Q 424,600 424,604 V 620 Q 424,624 420,624 H 388" fill="none" stroke="#bf4520" stroke-width="1.4" marker-end="url(#design-3-sequence-arrow-accent)"/>
<!-- Message labels -->
<rect x="174" y="130" width="164" height="12" rx="2" fill="#f5f5f5"/>
<text x="256" y="139" fill="#2e5aa8" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.04em">MetricsForPodSandboxList(ctx)</text>
<rect x="436" y="172" width="152" height="24" rx="2" fill="#f5f5f5"/>
<text x="512" y="181" fill="#4f5d75" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.04em">collect() BEFORE Lock</text>
<text x="512" y="193" fill="#4f5d75" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.04em">(no statsMu/metricsMu held)</text>
<rect x="944" y="290" width="180" height="12" rx="2" fill="#f5f5f5"/>
<text x="1034.0" y="299" fill="#4f5d75" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.04em">RemoveSandbox acquires stateLock</text>
<rect x="690" y="326" width="156" height="12" rx="2" fill="#f5f5f5"/>
<text x="768" y="335" fill="#4f5d75" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.04em">RemoveMetricsForPodSandbox()</text>
<rect x="690" y="360" width="156" height="24" rx="2" fill="#f5f5f5"/>
<text x="768" y="369" fill="#4f5d75" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.04em">Evict cached metrics</text>
<text x="768" y="381" fill="#4f5d75" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.04em">without waiting for the walk</text>
<rect x="944" y="426" width="104" height="12" rx="2" fill="#f5f5f5"/>
<text x="996.0" y="435" fill="#4f5d75" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.04em">releases stateLock</text>
<rect x="942" y="466" width="164" height="12" rx="2" fill="#f5f5f5"/>
<text x="1024" y="475" fill="#4f5d75" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.04em">RunPodSandbox needs stateLock</text>
<rect x="954" y="504" width="140" height="24" rx="2" fill="#f5f5f5"/>
<text x="1024" y="513" fill="#4f5d75" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.04em">Can proceed after removal</text>
<text x="1024" y="525" fill="#4f5d75" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.04em">releases stateLock</text>
<rect x="434" y="558" width="156" height="12" rx="2" fill="#f5f5f5"/>
<text x="512" y="567" fill="#4f5d75" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.04em">Walk finishes after eviction</text>
<rect x="432" y="600" width="148" height="24" rx="2" fill="#f5f5f5"/>
<text x="506.0" y="609" fill="#bf4520" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.04em">Unconditional put can</text>
<text x="506.0" y="621" fill="#bf4520" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.04em">recreate the removed entry</text>
<!-- Note over W -->
<rect x="652" y="216" width="160" height="36" rx="4" fill="#ececec" stroke="#2d3142" stroke-width="0.8" stroke-opacity="0.22"/>
<text x="732" y="231" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">OCI walk holds container</text>
<text x="732" y="244" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">opLock for reading</text>
<!-- Actors -->
