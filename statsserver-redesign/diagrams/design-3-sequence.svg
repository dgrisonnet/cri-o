<rect x="40" y="40" width="176" height="56" rx="6" fill="#f5f5f5"/>
<rect x="40" y="40" width="176" height="56" rx="6" fill="#4f5d75" stroke="#5a6580" stroke-width="1" fill-opacity="0.10"/>
