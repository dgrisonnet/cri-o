<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Design 3 overview: two projections, one sample</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-accent:  #bf4520;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', 'Noto Serif', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }
    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }
    .frame { max-width: 1000px; width: 100%; }
    .diagram-container { width: 100%; overflow-x: auto; }
    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }
    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }
    svg { width: 100%; min-width: 960px; display: block; }
    @media print {
      .diagram-container { overflow-x: visible; }
      svg { min-width: 0; }
    }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Design 3 · Overview</p>
    <h1>Overview</h1>
    <div class="diagram-container">
      <svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="design-3-overview-title design-3-overview-desc">
        <title id="design-3-overview-title">Design 3 overview: two projections, one sample</title>
        <desc id="design-3-overview-desc">Stats and metrics requests each gather their data, then take a brief cache lock to publish stats or metrics.</desc>
        <defs>
          <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
          <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#bf4520"/></marker>
          <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
          
        </defs>
        <rect width="100%" height="100%" fill="#f5f5f5"/>
<line x1="280" y1="120" x2="280" y2="232" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
<line x1="280" y1="288" x2="280" y2="400" stroke="#bf4520" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
<line x1="680" y1="120" x2="680" y2="232" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
<line x1="680" y1="288" x2="680" y2="400" stroke="#bf4520" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
<rect x="290" y="338.0" width="96" height="12" rx="2" fill="#f5f5f5"/>
<text x="338.0" y="347.0" fill="#bf4520" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">BRIEF CACHE LOCK</text>
<rect x="690" y="338.0" width="96" height="12" rx="2" fill="#f5f5f5"/>
<text x="738.0" y="347.0" fill="#bf4520" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">BRIEF CACHE LOCK</text>
<!-- Node: Stats request -->
<rect x="120" y="64" width="320" height="56" rx="6" fill="#f5f5f5"/>
<rect x="120" y="64" width="320" height="56" rx="6" fill="rgba(79,93,117,0.10)" stroke="#5a6580" stroke-width="1"/>
<text x="280.0" y="96.0" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">Stats request</text>
<!-- Node: Metrics request -->
<rect x="520" y="64" width="320" height="56" rx="6" fill="#f5f5f5"/>
<rect x="520" y="64" width="320" height="56" rx="6" fill="rgba(79,93,117,0.10)" stroke="#5a6580" stroke-width="1"/>
<text x="680.0" y="96.0" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">Metrics request</text>
<!-- Node: Gather stats -->
<rect x="120" y="232" width="320" height="56" rx="6" fill="#f5f5f5"/>
<rect x="120" y="232" width="320" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
<text x="280.0" y="264.0" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">Gather stats and writable-layer usage</text>
<!-- Node: Gather metrics -->
<rect x="520" y="232" width="320" height="56" rx="6" fill="#f5f5f5"/>
<rect x="520" y="232" width="320" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
<text x="680.0" y="264.0" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">Gather enabled metrics</text>
<!-- Node: Publish stats -->
<rect x="120" y="400" width="320" height="56" rx="6" fill="#f5f5f5"/>
<rect x="120" y="400" width="320" height="56" rx="6" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
<text x="280.0" y="432.0" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">Publish stats</text>
<!-- Node: Publish metrics -->
<rect x="520" y="400" width="320" height="56" rx="6" fill="#f5f5f5"/>
<rect x="520" y="400" width="320" height="56" rx="6" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
<text x="680.0" y="432.0" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">Publish metrics</text>
<line x1="40" y1="528" x2="920" y2="528" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
<text x="40" y="544" fill="#4f5d75" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" letter-spacing="0.18em">LEGEND</text>
<rect x="40" y="554" width="14" height="10" rx="2" fill="rgba(79,93,117,0.10)" stroke="#5a6580" stroke-width="1"/>
<text x="60" y="562" fill="#4f5d75" font-size="8.5" font-family="'Geist', system-ui, sans-serif">Request</text>
<rect x="123" y="554" width="14" height="10" rx="2" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
<text x="143" y="562" fill="#4f5d75" font-size="8.5" font-family="'Geist', system-ui, sans-serif">Gather step</text>
<rect x="227" y="554" width="14" height="10" rx="2" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
<text x="247" y="562" fill="#4f5d75" font-size="8.5" font-family="'Geist', system-ui, sans-serif">Publish to cache</text>
<line x1="356" y1="559" x2="384" y2="559" stroke="#bf4520" stroke-width="1.2" marker-end="url(#arrow-accent)"/>
<text x="392" y="562" fill="#4f5d75" font-size="8.5" font-family="'Geist', system-ui, sans-serif">Brief cache lock</text>
<line x1="501" y1="559" x2="529" y2="559" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
<text x="537" y="562" fill="#4f5d75" font-size="8.5" font-family="'Geist', system-ui, sans-serif">Flow</text>
      </svg>
    </div>
  </div>
</body>
</html>
