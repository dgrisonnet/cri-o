<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1280 720" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="design-2-sequence-title design-2-sequence-desc" id="design-2-sequence-root">
        <title id="design-2-sequence-title">Design 2 request sequence</title>
        <desc id="design-2-sequence-desc">Sequence diagram of sampleStore.getOrCollect: a cached hit is a locked O(1) read, while a miss runs the collect() closure with no lock held, a concurrent remove(id) may delete the entry meanwhile, and the unconditional put can recreate it before current and previous samples return to the caller.</desc>
