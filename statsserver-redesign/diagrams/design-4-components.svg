<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1280 720" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="design-4-components-title design-4-components-desc" id="design-4-components-root">
        <title id="design-4-components-title">Design 4 detailed data flow</title>
        <desc id="design-4-components-desc">CRI stats and metrics handlers reach a per-pod sandboxCollector through an O(1) collectorRegistry; the collector gathers one containerSample feeding stats and metrics projections, and only the DiskMetrics case calls the runtime DiskStats walk while collector.mu is held, while RemoveSandbox detaches the collector without taking its lock.</desc>
