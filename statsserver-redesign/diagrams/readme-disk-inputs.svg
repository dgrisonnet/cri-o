<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1280 720" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="readme-disk-inputs-title readme-disk-inputs-desc" id="readme-disk-inputs-root">
        <title id="readme-disk-inputs-title">Disk inputs and where the results are used</title>
        <desc id="readme-disk-inputs-desc">Three collection paths each call DiskStats under StatsServer.mutex; the WritableLayer value is overwritten by populateWritableLayer, and RemoveSandbox waits on the mutex while RunPodSandbox waits on stateLock.</desc>
        <defs>
      <style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;family=Noto+Serif:ital@0;1&amp;family=Noto+Sans+KR:wght@400;500;600&amp;family=Noto+Serif+KR:wght@400&amp;family=Noto+Sans+TC:wght@400;500;600&amp;family=Noto+Serif+TC:wght@400&amp;display=swap');
      #readme-disk-inputs-root { --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-accent:  #bf4520;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace; }
      #readme-disk-inputs-root { font-family: var(--font-sans); color: var(--color-ink); }
      #readme-disk-inputs-root .diagram-container { width: 100%; overflow-x: auto; }
      @media print {
#readme-disk-inputs-root .diagram-container { overflow-x: visible; }
}</style>
