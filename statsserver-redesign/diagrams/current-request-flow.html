<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>How requests get their data</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-accent:  #bf4520;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }
    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }
    .frame { max-width: 1000px; width: 100%; min-width: 0; }
    .diagram-container { width: 100%; overflow-x: auto; }
    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }
    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }
    svg { width: 100%; min-width: 960px; display: block; }
    @media print {
      .diagram-container { overflow-x: visible; }
      svg { min-width: 0; }
    }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Flowchart · Current design</p>
    <h1>How requests get their data</h1>
    <div class="diagram-container">
      <svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="current-request-flow-title current-request-flow-desc">
        <title id="current-request-flow-title">How CRI stats and metrics requests get their data</title>
        <desc id="current-request-flow-desc">Every CRI stats or metrics request, the periodic refresh, and sandbox removal go through the same StatsServer lock, which serves a cached response on a periodic hit or collects and updates the cache otherwise.</desc>
        <defs>
          <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
          <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#bf4520"/></marker>
          <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
        </defs>
        <rect width="100%" height="100%" fill="#f5f5f5"/>
        <!-- zones -->
        <!-- connectors (drawn before nodes) -->
        <path d="M240,208 H320" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <path d="M520,196 H560 Q568,196 568,188 V120 Q568,112 576,112 H712" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <path d="M520,220 H560 Q568,220 568,228 V296 Q568,304 576,304 H712" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <path d="M808,416 V336" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <path d="M420,416 V240" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <!-- arrow labels -->
        <rect x="602" y="92" width="76" height="12" rx="2" fill="#f5f5f5"/>
        <text x="640" y="101" fill="#5a6580" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">PERIODIC HIT</text>
        <rect x="596" y="284" width="88" height="12" rx="2" fill="#f5f5f5"/>
        <text x="640" y="293" fill="#5a6580" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">ON DEMAND/MISS</text>
        <rect x="812" y="370" width="68" height="12" rx="2" fill="#f5f5f5"/>
        <text x="846" y="379" fill="#5a6580" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">TAKES LOCK</text>
        <rect x="428" y="322" width="88" height="12" rx="2" fill="#f5f5f5"/>
        <text x="472" y="331" fill="#5a6580" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">WAITS FOR LOCK</text>
        <!-- nodes -->
        <rect x="48" y="176" width="192" height="64" rx="6" fill="#f5f5f5"/>
        <rect x="48" y="176" width="192" height="64" rx="6" fill="rgba(79,93,117,0.10)" stroke="#5a6580" stroke-width="1"/>
        <text x="144" y="204" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">CRI stats or</text>
        <text x="144" y="219" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">metrics request</text>
        <rect x="320" y="176" width="200" height="64" rx="6" fill="#f5f5f5"/>
        <rect x="320" y="176" width="200" height="64" rx="6" fill="rgba(191,69,32,0.08)" stroke="#bf4520" stroke-width="1"/>
        <text x="420" y="204" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">StatsServer takes</text>
        <text x="420" y="219" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">shared lock</text>
        <rect x="712" y="80" width="192" height="64" rx="6" fill="#f5f5f5"/>
        <rect x="712" y="80" width="192" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="808" y="115.5" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">Return cached response</text>
        <rect x="712" y="272" width="192" height="64" rx="6" fill="#f5f5f5"/>
        <rect x="712" y="272" width="192" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="808" y="307.5" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">Collect and update cache</text>
        <rect x="712" y="416" width="192" height="64" rx="6" fill="#f5f5f5"/>
        <rect x="712" y="416" width="192" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="808" y="445" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">Periodic refresh</text>
        <text x="808" y="461" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">collection_period &gt; 0</text>
        <rect x="320" y="416" width="200" height="64" rx="6" fill="#f5f5f5"/>
        <rect x="320" y="416" width="200" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="420" y="445" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">Sandbox removal</text>
        <text x="420" y="461" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">holds stateLock</text>
        <!-- legend -->
        <line x1="40" y1="540" x2="920" y2="540" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
        <text x="40" y="560" fill="#4f5d75" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" letter-spacing="0.14em">LEGEND</text>
        <rect x="128" y="550" width="16" height="12" rx="2" fill="rgba(79,93,117,0.10)" stroke="#5a6580"/>
        <text x="152" y="560" fill="#4f5d75" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" letter-spacing="0.08em">CRI REQUEST</text>
        <rect x="244" y="550" width="16" height="12" rx="2" fill="rgba(191,69,32,0.08)" stroke="#bf4520"/>
        <text x="268" y="560" fill="#4f5d75" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" letter-spacing="0.08em">SHARED LOCK</text>
        <rect x="360" y="550" width="16" height="12" rx="2" fill="#ffffff" stroke="#2d3142"/>
        <text x="384" y="560" fill="#4f5d75" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" letter-spacing="0.08em">STEP</text>
        <line x1="436" y1="556" x2="460" y2="556" stroke="#4f5d75" stroke-width="1.2"/>
        <polygon points="460,553 466,556 460,559" fill="#4f5d75"/>
        <text x="474" y="560" fill="#4f5d75" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" letter-spacing="0.08em">FLOW / WAIT</text>
      </svg>
    </div>
  </div>
</body>
</html>
