        <title id="review-proposed-components-title">Proposed stats and metrics design components</title>
        <desc id="review-proposed-components-desc">Stats and metrics triggers pass through separate admission budgets, each RPC selects its own core, process, disk or VM shim reads, a runtime adapter carries field availability and normalizes host and guest counters, projections build values, and the store publishes immutable results only after validating the lifecycle token and rejecting older observations, while removal invalidates the token and evicts entries.</desc>
