<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1280 720" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="current-collection-paths-title current-collection-paths-desc" id="current-collection-paths-root">
        <title id="current-collection-paths-title">Linux collection paths and runtime sources</title>
        <desc id="current-collection-paths-desc">CRI stats and metrics RPCs reach StatsServer accessors that, under one mutex, serve the cache or run three collection paths whose runtime, storage, cgroup, netlink, and procfs reads happen while the mutex is held; sandbox removal evicts entries under the same mutex.</desc>
        <defs>
      <style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;family=Noto+Serif:ital@0;1&amp;family=Noto+Sans+KR:wght@400;500;600&amp;family=Noto+Serif+KR:wght@400&amp;family=Noto+Sans+TC:wght@400;500;600&amp;family=Noto+Serif+TC:wght@400&amp;display=swap');
      #current-collection-paths-root { --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-accent:  #bf4520;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace; }
      #current-collection-paths-root { font-family: var(--font-sans); color: var(--color-ink); }
      #current-collection-paths-root .diagram-container { width: 100%; overflow-x: auto; }
      @media print {
#current-collection-paths-root .diagram-container { overflow-x: visible; }
}</style>
