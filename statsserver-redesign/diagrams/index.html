<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Stats server redesign — diagrams</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;600&family=Geist+Mono:wght@400&display=swap" rel="stylesheet">
<style>
  :root { --paper:#f5f5f5; --paper2:#ebebeb; --ink:#2d3142; --muted:#4f5d75; --rule:rgba(45,49,66,.14); --accent:#bf4520; }
  * { box-sizing:border-box; }
  html, body { margin:0; height:100%; background:var(--paper); color:var(--ink); font-family:Geist, system-ui, sans-serif; }
  body { display:grid; grid-template-columns:300px 1fr; }
  nav { border-right:1px solid var(--rule); overflow-y:auto; padding:24px 0 40px; }
  nav h1 { font-family:"Instrument Serif", Georgia, serif; font-weight:400; font-size:26px; line-height:1.1; margin:0 24px 4px; }
  nav .hint { font-family:"Geist Mono", ui-monospace, monospace; font-size:11px; color:var(--muted); margin:0 24px 20px; }
  nav h2 { font-family:"Geist Mono", ui-monospace, monospace; font-size:11px; font-weight:400; letter-spacing:.08em; text-transform:uppercase; color:var(--muted); margin:20px 24px 6px; }
  nav a { display:block; padding:6px 24px 6px 21px; border-left:3px solid transparent; color:var(--ink); text-decoration:none; font-size:14px; }
  nav a:hover { background:var(--paper2); }
  nav a.active { border-left-color:var(--accent); background:var(--paper2); font-weight:600; }
  nav a small { display:block; font-family:"Geist Mono", ui-monospace, monospace; font-size:10.5px; font-weight:400; color:var(--muted); margin-top:2px; }
  main { display:grid; grid-template-rows:auto 1fr; min-width:0; }
  header { display:flex; align-items:center; gap:16px; padding:12px 24px; border-bottom:1px solid var(--rule); font-size:13px; }
  header .title { font-weight:600; flex:1; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  header .used { font-family:"Geist Mono", ui-monospace, monospace; font-size:11px; color:var(--muted); }
  header a, header button { font:inherit; font-size:12px; color:var(--ink); background:#fff; border:1px solid var(--rule); border-radius:6px; padding:4px 10px; text-decoration:none; cursor:pointer; }
  header a:hover, header button:hover { border-color:var(--ink); }
  iframe { width:100%; height:100%; border:0; background:var(--paper); }
  .stage { overflow:auto; display:flex; align-items:flex-start; justify-content:center; padding:24px; min-height:0; }
  .stage img { max-width:100%; height:auto; background:var(--paper); }
  .stage.fitall img { max-height:calc(100vh - 110px); }
  [hidden] { display:none !important; }
  @media (max-width:800px) { body { grid-template-columns:1fr; grid-template-rows:40vh 1fr; } nav { border-right:0; border-bottom:1px solid var(--rule); } }
</style>
</head>
<body>
<nav id="nav">
  <h1>Stats server redesign</h1>
  <p class="hint">← / → or j / k to browse · f toggles page · click image to zoom</p>
  <h2>Companion</h2>
  <a href="collection-pseudocode.html" target="_blank">Collection pseudocode ↗<small>collection-pseudocode.html</small></a>
</nav>
<main>
  <header>
    <button id="prev" title="Previous (←)">←</button>
    <button id="next" title="Next (→)">→</button>
    <span class="title" id="title"></span>
    <span class="used" id="used"></span>
    <button id="mode" title="Toggle fit / editorial page (f)">Show page</button>
    <a id="svg" target="_blank">SVG</a>
    <a id="open" target="_blank">Open page</a>
  </header>
  <div class="stage fitall" id="stage"><img id="img" alt=""></div>
  <iframe id="frame" title="Diagram" hidden></iframe>
</main>
<script>
const GROUPS = [
  ["Problem & current design", [
    ["readme-wedge", "Lock wait chain", "README · github-issue-draft"],
    ["readme-disk-inputs", "Disk stats inputs", "README"],
    ["current-request-flow", "Current request flow", "current-design"],
    ["current-collection-paths", "Current collection paths", "current-design"],
  ]],
  ["Design 1 · Layered sample and project", [
    ["design-1-overview", "Overview", "design-1 · design-comparison"],
    ["design-1-components", "Components", "design-1"],
    ["design-1-types", "Data structures", "design-1"],
    ["design-1-sequence", "Request sequence", "design-1"],
  ]],
  ["Design 2 · Collector, store, projection", [
    ["design-2-overview", "Overview", "design-2 · design-comparison"],
    ["design-2-data-flow", "Detailed data flow", "design-2"],
    ["design-2-types", "Data structures", "design-2"],
    ["design-2-sequence", "Request sequence", "design-2"],
  ]],
  ["Design 3 · Two projections, one sample", [
    ["design-3-overview", "Overview", "design-3 · design-comparison"],
    ["design-3-components", "Components", "design-3"],
    ["design-3-types", "Data structures", "design-3"],
    ["design-3-sequence", "Request sequence", "design-3"],
  ]],
  ["Design 4 · Per-sandbox collector registry", [
    ["design-4-overview", "Overview", "design-4 · design-comparison"],
    ["design-4-components", "Components", "design-4"],
    ["design-4-types", "Data structures", "design-4"],
    ["design-4-sequence", "Request sequence", "design-4"],
  ]],
  ["Proposed design (review)", [
    ["review-proposed", "Proposed design — overview", "design-review · design-comparison · github-issue-draft"],
    ["review-proposed-components", "Proposed design — components", "design-review"],
    ["review-proposed-types", "Proposed design — data structures", "design-review"],
    ["review-proposed-cache-fill", "Proposed design — how the cache is filled", "design-review"],
    ["review-proposed-sequence", "Proposed design — removal during collection", "design-review"],
    ["review-proposed-publish", "Proposed design — publication rules", "design-review"],
  ]],
];
const nav = document.getElementById("nav"), frame = document.getElementById("frame");
const items = [];
for (const [group, list] of GROUPS) {
  const h = document.createElement("h2"); h.textContent = group; nav.appendChild(h);
  for (const [slug, label, used] of list) {
    const a = document.createElement("a");
    a.href = "#" + slug;
    a.innerHTML = label + "<small>" + slug + "</small>";
    nav.appendChild(a);
    items.push({ slug, label, used, group, a });
  }
}
let current = 0, pageMode = false;
function setMode(page) {
  pageMode = page;
  frame.hidden = !page; document.getElementById("stage").hidden = page;
  document.getElementById("mode").textContent = page ? "Fit diagram" : "Show page";
  if (page) frame.src = items[current].slug + ".html";
}
function show(i) {
  current = (i + items.length) % items.length;
  const it = items[current];
  items.forEach(x => x.a.classList.toggle("active", x === it));
  const img = document.getElementById("img");
  img.src = it.slug + ".svg"; img.alt = it.label;
  if (pageMode) frame.src = it.slug + ".html";
  document.getElementById("title").textContent = it.group + " — " + it.label;
  document.getElementById("used").textContent = "used in: " + it.used;
  document.getElementById("svg").href = it.slug + ".svg";
  document.getElementById("open").href = it.slug + ".html";
  if (location.hash !== "#" + it.slug) history.replaceState(null, "", "#" + it.slug);
  it.a.scrollIntoView({ block: "nearest" });
}
function fromHash() {
  const i = items.findIndex(x => "#" + x.slug === location.hash);
  show(i < 0 ? 0 : i);
}
window.addEventListener("hashchange", fromHash);
document.getElementById("prev").onclick = () => show(current - 1);
document.getElementById("mode").onclick = () => setMode(!pageMode);
document.getElementById("img").onclick = () => document.getElementById("stage").classList.toggle("fitall");
document.getElementById("next").onclick = () => show(current + 1);
function onKey(e) {
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  if (e.key === "ArrowRight" || e.key === "j") { show(current + 1); e.preventDefault(); }
  if (e.key === "ArrowLeft" || e.key === "k") { show(current - 1); e.preventDefault(); }
  if (e.key === "f") setMode(!pageMode);
}
document.addEventListener("keydown", onKey);
// keep arrow keys working after clicking inside the diagram
frame.addEventListener("load", () => { try { frame.contentWindow.document.addEventListener("keydown", onKey); } catch (_) {} });
fromHash();
</script>
</body>
</html>
