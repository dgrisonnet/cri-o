        <text x="640" y="363.5" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">Build metrics</text>
        <rect x="220" y="440" width="200" height="48" rx="6" fill="#f5f5f5"/>
