<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="design-1-overview-title design-1-overview-desc" id="design-1-overview-root">
        <title id="design-1-overview-title">Design 1 overview: layered sample-and-project</title>
        <desc id="design-1-overview-desc">Flow in which a request or periodic refresh chooses inputs for the requested views, collects one sample outside cache locks, and builds stats and metrics into separate caches.</desc>
        <defs>
      <style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;family=Noto+Serif:ital@0;1&amp;family=Noto+Sans+KR:wght@400;500;600&amp;family=Noto+Serif+KR:wght@400&amp;family=Noto+Sans+TC:wght@400;500;600&amp;family=Noto+Serif+TC:wght@400&amp;display=swap');
      #design-1-overview-root { --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-accent:  #bf4520;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace; }
      #design-1-overview-root { font-family: var(--font-sans); color: var(--color-ink); }
      #design-1-overview-root .diagram-container { width: 100%; overflow-x: auto; }
      @media print {
#design-1-overview-root .diagram-container { overflow-x: visible; }
}</style>
          <marker id="design-1-overview-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
          <marker id="design-1-overview-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#bf4520"/></marker>
          <marker id="design-1-overview-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>

        </defs>
        <rect width="100%" height="100%" fill="#f5f5f5"/>
        <!-- connectors -->
        <line x1="480" y1="96" x2="480" y2="136" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#design-1-overview-arrow)"/>
        <line x1="480" y1="184" x2="480" y2="224" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#design-1-overview-arrow)"/>
        <path d="M 424,272 V 296 Q 424,304 416,304 H 328 Q 320,304 320,312 V 336" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#design-1-overview-arrow)"/>
        <path d="M 536,272 V 296 Q 536,304 544,304 H 632 Q 640,304 640,312 V 336" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#design-1-overview-arrow)"/>
        <line x1="320" y1="384" x2="320" y2="440" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#design-1-overview-arrow)"/>
        <line x1="640" y1="384" x2="640" y2="440" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#design-1-overview-arrow)"/>
