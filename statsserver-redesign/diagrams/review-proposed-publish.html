<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Proposed design — publication rules</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&family=Noto+Serif:ital@0;1&family=Noto+Sans+KR:wght@400;500;600&family=Noto+Serif+KR:wght@400&family=Noto+Sans+TC:wght@400;500;600&family=Noto+Serif+TC:wght@400&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;   /* white-smoke */
      --color-ink:     #2d3142;   /* jet-black */
      --color-muted:   #4f5d75;   /* blue-slate */
      --color-accent:  #bf4520;   /* burnt-tangerine */
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', 'Noto Serif', 'Noto Serif KR', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }

    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }

    .frame { max-width: 1320px; width: 100%; }
    /* The SVG holds its readable width (min-width == the viewBox width, so the
       type ramp is never silently scaled down). This wrapper lets a narrow
       screen scroll the diagram instead of the whole page. */
    .diagram-container { width: 100%; overflow-x: auto; }

    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }

    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }

    svg { width: 100%; min-width: 1280px; display: block; }
    /* Paper has no scrollbar, so the local scroller would clip instead of
       scroll. Let the diagram scale down to the sheet: smaller but whole
       beats sharp but cut off. Must come after the svg rule above - a media
       query adds no specificity, so a later plain rule would win. */
    @media print {
      .diagram-container { overflow-x: visible; }
      svg { min-width: 0; }
    }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Design review · Proposed approach</p>
    <h1>Proposed design — publication rules</h1>
    <div class="diagram-container">
      <svg viewBox="0 0 1280 720" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="review-proposed-publish-title review-proposed-publish-desc">
        <title id="review-proposed-publish-title">Proposed design publication rules</title>
        <desc id="review-proposed-publish-desc">A collection result keeps the previous sample if a required read failed, leaves missing fields absent if an optional read failed, and is then published as an immutable entry only if, under the store lock, its identity token is still valid and its observation is newer than the accepted one.</desc>
        <defs>
          <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
          <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#bf4520"/></marker>
        </defs>
        <rect width="100%" height="100%" fill="#f5f5f5"/>
        <g transform="translate(0,-32)">
        <!-- zone: short store lock -->
        <rect x="668" y="144" width="572" height="376" rx="8" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.30)" stroke-width="1" stroke-dasharray="4,3"/>
        <text x="1224" y="164" fill="#4f5d75" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="end" letter-spacing="0.14em">SHORT STORE LOCK · ATOMIC WITH REMOVAL INVALIDATION</text>
        <!-- connectors -->
        <text x="40" y="276" fill="#4f5d75" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" letter-spacing="0.14em">RESULT IN</text>
        <path d="M40,288 H96" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <path d="M172,336 V432" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <path d="M248,288 H296" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <path d="M448,288 H484" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <path d="M372,240 V120 Q372,112 380,112 H764 Q772,112 772,120 V240" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <path d="M660,288 H696" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <path d="M848,288 H896" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <path d="M772,336 V432" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <path d="M1048,288 H1088" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <path d="M972,336 V432" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <!-- arrow labels -->
        <rect x="180" y="378" width="32" height="12" rx="2" fill="#f5f5f5"/>
        <text x="196" y="387" fill="#4f5d75" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.12em">YES</text>
        <rect x="260" y="270" width="24" height="12" rx="2" fill="#f5f5f5"/>
        <text x="272" y="279" fill="#4f5d75" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.12em">NO</text>
        <rect x="450" y="270" width="32" height="12" rx="2" fill="#f5f5f5"/>
        <text x="466" y="279" fill="#4f5d75" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.12em">YES</text>
        <rect x="380" y="164" width="24" height="12" rx="2" fill="#f5f5f5"/>
        <text x="392" y="173" fill="#4f5d75" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.12em">NO</text>
        <rect x="856" y="270" width="32" height="12" rx="2" fill="#f5f5f5"/>
        <text x="872" y="279" fill="#4f5d75" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.12em">YES</text>
        <rect x="780" y="378" width="24" height="12" rx="2" fill="#f5f5f5"/>
        <text x="792" y="387" fill="#4f5d75" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.12em">NO</text>
        <rect x="1052" y="270" width="32" height="12" rx="2" fill="#f5f5f5"/>
        <text x="1068" y="279" fill="#4f5d75" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.12em">YES</text>
        <rect x="980" y="378" width="24" height="12" rx="2" fill="#f5f5f5"/>
        <text x="992" y="387" fill="#4f5d75" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.12em">NO</text>
        <!-- nodes -->
        <polygon points="172,240 248,288 172,336 96,288" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="172" y="285" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">Required read</text>
        <text x="172" y="300" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">failed?</text>
        <polygon points="372,240 448,288 372,336 296,288" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="372" y="285" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">Optional read</text>
        <text x="372" y="300" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">failed?</text>
        <rect x="484" y="260" width="176" height="56" rx="6" fill="#f5f5f5"/>
        <rect x="484" y="260" width="176" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="572" y="286" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">Missing fields absent</text>
        <text x="572" y="301" fill="#4f5d75" font-size="9" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">available fields stay usable</text>
        <polygon points="772,240 848,288 772,336 696,288" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="772" y="285" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">Identity token</text>
        <text x="772" y="300" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">still valid?</text>
        <polygon points="972,240 1048,288 972,336 896,288" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="972" y="285" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">Newer by</text>
        <text x="972" y="300" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">monotonic time?</text>
        <rect x="1088" y="256" width="136" height="64" rx="20" fill="#f5f5f5"/>
        <rect x="1088" y="256" width="136" height="64" rx="20" fill="rgba(191,69,32,0.08)" stroke="#bf4520" stroke-width="1"/>
        <text x="1156" y="286.0" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">Publish</text>
        <text x="1156" y="301.0" fill="#4f5d75" font-size="9" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">immutable entry</text>
        <rect x="84" y="432" width="176" height="56" rx="20" fill="#f5f5f5"/>
        <rect x="84" y="432" width="176" height="56" rx="20" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
        <text x="172" y="458.0" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">Keep previous sample</text>
        <text x="172" y="473.0" fill="#4f5d75" font-size="9" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">and its age</text>
        <rect x="688" y="432" width="168" height="56" rx="20" fill="#f5f5f5"/>
        <rect x="688" y="432" width="168" height="56" rx="20" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
        <text x="772" y="458.0" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">Drop result</text>
        <text x="772" y="473.0" fill="#4f5d75" font-size="9" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">token was invalidated</text>
        <rect x="888" y="432" width="168" height="56" rx="20" fill="#f5f5f5"/>
        <rect x="888" y="432" width="168" height="56" rx="20" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
        <text x="972" y="458.0" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">Reject observation</text>
        <text x="972" y="473.0" fill="#4f5d75" font-size="9" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">ties broken deterministically</text>
        <!-- annotation -->
        <path d="M1156,556 V324" fill="none" stroke="rgba(45,49,66,0.40)" stroke-width="1" stroke-dasharray="4,3"/>
        <circle cx="1156" cy="322" r="2" fill="#2d3142"/>
        <text x="1224" y="580" fill="#2d3142" font-size="14" font-style="italic" font-family="'Instrument Serif', serif" text-anchor="end">CPU rate only between ordered observations of the same identity and counter source</text>
        <text x="1224" y="600" fill="#2d3142" font-size="14" font-style="italic" font-family="'Instrument Serif', serif" text-anchor="end">with positive elapsed time; a counter reset starts a new baseline.</text>
        </g>
        <!-- legend -->
        <line x1="40" y1="624" x2="1240" y2="624" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
        <text x="40" y="652" fill="#4f5d75" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" letter-spacing="0.14em">LEGEND</text>
        <polygon points="128,648 140,642 152,648 140,654" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="160" y="652" fill="#4f5d75" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" letter-spacing="0.08em">DECISION</text>
        <rect x="232" y="642" width="16" height="12" rx="2" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="256" y="652" fill="#4f5d75" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" letter-spacing="0.08em">STEP</text>
        <rect x="308" y="642" width="24" height="12" rx="6" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
        <text x="340" y="652" fill="#4f5d75" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" letter-spacing="0.08em">OUTCOME</text>
        <rect x="412" y="642" width="24" height="12" rx="6" fill="rgba(191,69,32,0.08)" stroke="#bf4520" stroke-width="1"/>
        <text x="444" y="652" fill="#4f5d75" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" letter-spacing="0.08em">PUBLISHED</text>
        <rect x="528" y="642" width="24" height="12" rx="2" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.30)" stroke-width="1" stroke-dasharray="4,3"/>
        <text x="560" y="652" fill="#4f5d75" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" letter-spacing="0.08em">STORE LOCK</text>
        <line x1="652" y1="648" x2="676" y2="648" stroke="#4f5d75" stroke-width="1.2"/>
        <polygon points="676,645 682,648 676,651" fill="#4f5d75"/>
        <text x="690" y="652" fill="#4f5d75" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" letter-spacing="0.08em">FLOW</text>
      </svg>
    </div>
  </div>
</body>
</html>
