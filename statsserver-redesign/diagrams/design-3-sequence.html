<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Design 3 request sequence: eviction and late publication</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-accent:  #bf4520;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', 'Noto Serif', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }
    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }
    .frame { max-width: 1320px; width: 100%; }
    .diagram-container { width: 100%; overflow-x: auto; }
    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }
    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }
    svg { width: 100%; min-width: 1280px; display: block; }
    @media print {
      .diagram-container { overflow-x: visible; }
      svg { min-width: 0; }
    }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Design 3 · Request sequence</p>
    <h1>Request sequence (cache eviction and late publication)</h1>
    <div class="diagram-container">
      <svg viewBox="0 0 1280 720" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="design-3-sequence-title design-3-sequence-desc">
        <title id="design-3-sequence-title">Design 3 request sequence: eviction and late publication</title>
        <desc id="design-3-sequence-desc">Sequence in which a slow metrics poll starts a DiskStats walk with no cache lock held, sandbox removal evicts the cached metrics and releases stateLock without waiting, and the walk then finishes and its unconditional put can recreate the removed entry.</desc>
        <defs>
          <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
          <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#bf4520"/></marker>
          <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
          
        </defs>
        <rect width="100%" height="100%" fill="#f5f5f5"/>
<!-- Lifelines -->
<line x1="128" y1="96" x2="128" y2="648" stroke="rgba(45,49,66,0.22)" stroke-width="1" stroke-dasharray="3,3"/>
<line x1="384" y1="96" x2="384" y2="648" stroke="rgba(45,49,66,0.22)" stroke-width="1" stroke-dasharray="3,3"/>
<line x1="640" y1="96" x2="640" y2="648" stroke="rgba(45,49,66,0.22)" stroke-width="1" stroke-dasharray="3,3"/>
<line x1="896" y1="96" x2="896" y2="648" stroke="rgba(45,49,66,0.22)" stroke-width="1" stroke-dasharray="3,3"/>
<line x1="1152" y1="96" x2="1152" y2="648" stroke="rgba(45,49,66,0.22)" stroke-width="1" stroke-dasharray="3,3"/>
<!-- Activation bars -->
<rect x="380" y="148" width="8" height="484" fill="rgba(45,49,66,0.06)" stroke="#4f5d75" stroke-width="0.8"/>
<rect x="636" y="204" width="8" height="372" fill="rgba(45,49,66,0.06)" stroke="#4f5d75" stroke-width="0.8"/>
<rect x="892" y="280" width="8" height="264" fill="rgba(45,49,66,0.06)" stroke="#4f5d75" stroke-width="0.8"/>
<rect x="1148" y="480" width="8" height="64" fill="rgba(45,49,66,0.06)" stroke="#4f5d75" stroke-width="0.8"/>
<!-- Messages (time flows down) -->
<line x1="128" y1="148" x2="380" y2="148" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#arrow-link)"/>
<line x1="388" y1="204" x2="636" y2="204" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
<path d="M 900,284 H 932 Q 936,284 936,288 V 304 Q 936,308 932,308 H 900" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
<line x1="892" y1="344" x2="388" y2="344" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
<line x1="388" y1="392" x2="892" y2="392" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
<path d="M 900,420 H 932 Q 936,420 936,424 V 440 Q 936,444 932,444 H 900" fill="none" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
<line x1="1148" y1="484" x2="900" y2="484" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
<line x1="900" y1="536" x2="1148" y2="536" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
<line x1="636" y1="576" x2="388" y2="576" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
<path d="M 388,600 H 420 Q 424,600 424,604 V 620 Q 424,624 420,624 H 388" fill="none" stroke="#bf4520" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
<!-- Message labels -->
<rect x="174" y="130" width="164" height="12" rx="2" fill="#f5f5f5"/>
<text x="256" y="139" fill="#2e5aa8" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.04em">MetricsForPodSandboxList(ctx)</text>
<rect x="436" y="172" width="152" height="24" rx="2" fill="#f5f5f5"/>
<text x="512" y="181" fill="#4f5d75" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.04em">collect() BEFORE Lock</text>
<text x="512" y="193" fill="#4f5d75" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.04em">(no statsMu/metricsMu held)</text>
<rect x="944" y="290" width="180" height="12" rx="2" fill="#f5f5f5"/>
<text x="1034.0" y="299" fill="#4f5d75" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.04em">RemoveSandbox acquires stateLock</text>
<rect x="690" y="326" width="156" height="12" rx="2" fill="#f5f5f5"/>
<text x="768" y="335" fill="#4f5d75" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.04em">RemoveMetricsForPodSandbox()</text>
<rect x="690" y="360" width="156" height="24" rx="2" fill="#f5f5f5"/>
<text x="768" y="369" fill="#4f5d75" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.04em">Evict cached metrics</text>
<text x="768" y="381" fill="#4f5d75" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.04em">without waiting for the walk</text>
<rect x="944" y="426" width="104" height="12" rx="2" fill="#f5f5f5"/>
<text x="996.0" y="435" fill="#4f5d75" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.04em">releases stateLock</text>
<rect x="942" y="466" width="164" height="12" rx="2" fill="#f5f5f5"/>
<text x="1024" y="475" fill="#4f5d75" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.04em">RunPodSandbox needs stateLock</text>
<rect x="954" y="504" width="140" height="24" rx="2" fill="#f5f5f5"/>
<text x="1024" y="513" fill="#4f5d75" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.04em">Can proceed after removal</text>
<text x="1024" y="525" fill="#4f5d75" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.04em">releases stateLock</text>
<rect x="434" y="558" width="156" height="12" rx="2" fill="#f5f5f5"/>
<text x="512" y="567" fill="#4f5d75" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.04em">Walk finishes after eviction</text>
<rect x="432" y="600" width="148" height="24" rx="2" fill="#f5f5f5"/>
<text x="506.0" y="609" fill="#bf4520" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.04em">Unconditional put can</text>
<text x="506.0" y="621" fill="#bf4520" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.04em">recreate the removed entry</text>
<!-- Note over W -->
<rect x="652" y="216" width="160" height="36" rx="4" fill="#ececec" stroke="rgba(45,49,66,0.22)" stroke-width="0.8"/>
<text x="732" y="231" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">OCI walk holds container</text>
<text x="732" y="244" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">opLock for reading</text>
<!-- Actors -->
<!-- Node: K -->
<rect x="40" y="40" width="176" height="56" rx="6" fill="#f5f5f5"/>
<rect x="40" y="40" width="176" height="56" rx="6" fill="rgba(79,93,117,0.10)" stroke="#5a6580" stroke-width="1"/>
<text x="128.0" y="65.5" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">Kubelet</text>
<text x="128.0" y="78.5" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">slow metrics poll</text>
<!-- Node: S -->
<rect x="296" y="40" width="176" height="56" rx="6" fill="#f5f5f5"/>
<rect x="296" y="40" width="176" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
<text x="384.0" y="72.0" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">StatsServer</text>
<!-- Node: W -->
<rect x="552" y="40" width="176" height="56" rx="6" fill="#f5f5f5"/>
<rect x="552" y="40" width="176" height="56" rx="6" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
<text x="640.0" y="72.0" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">DiskStats walk</text>
<!-- Node: CS -->
<rect x="808" y="40" width="176" height="56" rx="6" fill="#f5f5f5"/>
<rect x="808" y="40" width="176" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
<text x="896.0" y="72.0" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">ContainerServer</text>
<!-- Node: P -->
<rect x="1064" y="40" width="176" height="56" rx="6" fill="#f5f5f5"/>
<rect x="1064" y="40" width="176" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
<text x="1152.0" y="72.0" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">RunPodSandbox</text>
<line x1="40" y1="664" x2="1240" y2="664" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
<text x="40" y="680" fill="#4f5d75" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" letter-spacing="0.18em">LEGEND</text>
<line x1="40" y1="695" x2="68" y2="695" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#arrow-link)"/>
<text x="76" y="698" fill="#4f5d75" font-size="8.5" font-family="'Geist', system-ui, sans-serif">CRI call</text>
<line x1="148" y1="695" x2="176" y2="695" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
<text x="184" y="698" fill="#4f5d75" font-size="8.5" font-family="'Geist', system-ui, sans-serif">Call / self-step</text>
<line x1="297" y1="695" x2="325" y2="695" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
<text x="333" y="698" fill="#4f5d75" font-size="8.5" font-family="'Geist', system-ui, sans-serif">Return / release</text>
<line x1="446" y1="695" x2="474" y2="695" stroke="#bf4520" stroke-width="1.2" marker-end="url(#arrow-accent)"/>
<text x="482" y="698" fill="#4f5d75" font-size="8.5" font-family="'Geist', system-ui, sans-serif">Stale write (open problem)</text>
<rect x="656" y="687" width="8" height="14" fill="rgba(45,49,66,0.06)" stroke="#4f5d75" stroke-width="0.8"/>
<text x="682" y="698" fill="#4f5d75" font-size="8.5" font-family="'Geist', system-ui, sans-serif">Activation</text>
<rect x="765" y="689" width="28" height="12" rx="2" fill="#ececec" stroke="rgba(45,49,66,0.22)" stroke-width="0.8"/>
<text x="801" y="698" fill="#4f5d75" font-size="8.5" font-family="'Geist', system-ui, sans-serif">Note</text>
      </svg>
    </div>
  </div>
</body>
</html>
