    <h1>Proposed design — removal during collection</h1>

        <title id="review-proposed-sequence-title">Proposed design sequence: removal during collection</title>
        <desc id="review-proposed-sequence-desc">Sequence diagram of the proposed design. A metrics poll captures an identity token and starts a disk metrics read that blocks. A same-pod stats request collects core stats with independent admission and its publish is accepted while the disk read is still blocked. The removal path then invalidates the token and evicts the entries, and removal completes without waiting for collection. When the disk read completes, its publish carries the captured token, the store rejects it because the token is invalid, and the old result cannot reappear. The store check and publish are atomic under a short lock, and an older observation is also rejected once a newer one is accepted.</desc>
